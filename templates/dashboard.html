{% extends "base.html" %}

{% block content %}

<h3>Welcome, {{ user }}</h3>

<a href="/complaint" class="btn btn-primary mb-3">Report New Complaint</a>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Description</th>
            <th>Risk</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for c in complaints %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
            <td>
                <span class="badge bg-warning">{{ c[4] }}</span>
            </td>
            <td>
                <span class="badge bg-info">{{ c[5] }}</span>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
